<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Текстовое поле и кнопка</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      overflow: hidden;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    textarea {
      flex: 1;
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: none;
      outline: none;
      resize: none;
    }

    .button-container {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px;
      background: white;
      box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      background-color: #007BFF;
      color: white;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <textarea placeholder="Введите текст..."></textarea>
    <div class="button-container" id="buttonContainer">
      <button onclick="handleSubmit()">Отправить</button>
    </div>
  </div>

  <script>
    function handleSubmit() {
      const textarea = document.querySelector('textarea')
      const text = textarea.value;
      alert('Отправлено: ' + text);
      textarea.value = ""
    }

    const buttonContainer = document.getElementById('buttonContainer');

    if (window.visualViewport) {
      const updatePosition = (event) => {
        const textarea = document.querySelector('textarea')
        const text = textarea.value;
        textarea.value = text + "\n" + event.type
        console.log(event.type)
        const viewportHeight = window.visualViewport.height;
        const layoutHeight = window.innerHeight;
        const keyboardHeight = layoutHeight - viewportHeight;

        // Если клавиатура открыта — сдвигаем кнопку вверх
        if (keyboardHeight > 150) {
          buttonContainer.style.transform = `translateY(-${keyboardHeight}px)`;
        } else {
          // Если клавиатура закрылась — сбрасываем transform
          buttonContainer.style.transform = 'translateY(0)';
        }
      };

      window.visualViewport.addEventListener('resize', updatePosition);
      window.visualViewport.addEventListener('scroll', updatePosition);
      window.addEventListener('load', updatePosition);
    }
  </script>
</body>
</html>
